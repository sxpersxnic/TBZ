openapi: 3.1.0

info:
    title: Library Management API
    description: API zur Verwaltung von Buechern und Autoren einer Bibliothek.
    version: 1.0.0

servers:
    - url: https://api.example.com

tags:
    - name: Books
      description: Verwaltung von Buechern
    - name: Authors
      description: Verwaltung von Autoren

paths:

    /books:
        get:
            tags:
                - Books
            summary: Alle Buecher abrufen
            operationId: getBooks
            responses:
                "200":
                    description: Liste aller Buecher
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Book"

        post:
            tags:
                - Books
            summary: Neues Buch erstellen
            operationId: createBook
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateBookInput"
            responses:
                "201":
                    description: Buch wurde erstellt
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Book"

    /books/{bookId}:
        parameters:
            - name: bookId
              in: path
              required: true
              description: ID des Buches
              schema:
                  type: integer
                  format: int64

        get:
            tags:
                - Books
            summary: Buch nach ID abrufen
            operationId: getBookById
            responses:
                "200":
                    description: Buch wurde gefunden
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Book"
                "404":
                    description: Buch wurde nicht gefunden

        put:
            tags:
                - Books
            summary: Buch aktualisieren
            operationId: updateBook
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateBookInput"
            responses:
                "200":
                    description: Buch wurde aktualisiert
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Book"
                "404":
                    description: Buch wurde nicht gefunden

        delete:
            tags:
                - Books
            summary: Buch loeschen
            operationId: deleteBook
            responses:
                "204":
                    description: Buch wurde erfolgreich geloescht
                "404":
                    description: Buch wurde nicht gefunden

    /authors:
        get:
            tags:
                - Authors
            summary: Alle Autoren abrufen
            operationId: getAuthors
            responses:
                "200":
                    description: Liste aller Autoren
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Author"

        post:
            tags:
                - Authors
            summary: Neuen Autor erstellen
            operationId: createAuthor
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateAuthorInput"
            responses:
                "201":
                    description: Autor wurde erstellt
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Author"

    /authors/{authorId}:
        parameters:
            - name: authorId
              in: path
              required: true
              description: ID des Autors
              schema:
                  type: integer
                  format: int64

        get:
            tags:
                - Authors
            summary: Autor nach ID abrufen
            operationId: getAuthorById
            responses:
                "200":
                    description: Autor wurde gefunden
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Author"
                "404":
                    description: Autor wurde nicht gefunden

        put:
            tags:
                - Authors
            summary: Autor aktualisieren
            operationId: updateAuthor
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateAuthorInput"
            responses:
                "200":
                    description: Autor wurde aktualisiert
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Author"
                "404":
                    description: Autor wurde nicht gefunden

components:

    schemas:

        Book:
            type: object
            required:
                - id
                - title
                - authors
            properties:
                id:
                    type: integer
                    format: int64
                    example: 1
                title:
                    type: string
                    example: Der Herr der Ringe
                description:
                    type:
                        - string
                        - "null"
                    example: Ein Fantasy-Roman ueber Mittelerde.
                publicationYear:
                    type:
                        - integer
                        - "null"
                    example: 1954
                authors:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/Author"

        Author:
            type: object
            required:
                - id
                - name
            properties:
                id:
                    type: integer
                    format: int64
                    example: 1
                name:
                    type: string
                    example: J. R. R. Tolkien
                birthDate:
                    type:
                        - string
                        - "null"
                    format: date
                    example: 1892-01-03
                books:
                    type: array
                    items:
                        $ref: "#/components/schemas/BookSummary"

        BookSummary:
            type: object
            required:
                - id
                - title
            properties:
                id:
                    type: integer
                    format: int64
                title:
                    type: string

        CreateBookInput:
            type: object
            required:
                - title
                - authors
            properties:
                title:
                    type: string
                description:
                    type:
                        - string
                        - "null"
                publicationYear:
                    type:
                        - integer
                        - "null"
                authors:
                    type: array
                    minItems: 1
                    items:
                        type: integer
                        format: int64

        UpdateBookInput:
            type: object
            properties:
                title:
                    type: string
                description:
                    type:
                        - string
                        - "null"
                publicationYear:
                    type:
                        - integer
                        - "null"
                authors:
                    type: array
                    minItems: 1
                    items:
                        type: integer
                        format: int64

        CreateAuthorInput:
            type: object
            required:
                - name
            properties:
                name:
                    type: string
                birthDate:
                    type:
                        - string
                        - "null"
                    format: date

        UpdateAuthorInput:
            type: object
            properties:
                name:
                    type: string
                birthDate:
                    type:
                        - string
                        - "null"
                    format: date
